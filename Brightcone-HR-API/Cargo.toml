[workspace]

[package]
name = "brightcone-hr-portal"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "brightcone-hr-portal-cli"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.2", default-features = false, features = ["cli", "with-db", "auth", "worker"] }

[dependencies]
loco-rs = { workspace = true }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
sea-orm-migration = { version = "2.0", features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "sqlx-postgres",
] }
chrono = { version = "0.4" }
uuid = { version = "1.6", features = ["v4"] }
validator = { version = "0.20" }
include_dir = { version = "0.7" }
utoipa = { version = "5", features = ["chrono", "uuid"] }
ring = "0.17.14"
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
governor = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "json",
  "macros",
  "chrono",
  "uuid",
] }
dotenvy = "0.15"
sha2 = "0.10"
hex = "0.4"
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
# view engine i18n
fluent-templates = { version = "0.15", features = ["tera"] }
unic-langid = { version = "0.9" }
# /view engine
axum-extra = { version = "0.10", features = ["form"] }

[[bin]]
name = "brightcone-hr-portal-cli"
path = "src/bin/main.rs"
required-features = []
[[bin]]
name = "tool"
path = "src/bin/tool.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
axum-test = "17"
